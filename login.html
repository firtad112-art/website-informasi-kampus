
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusInfo | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">CampusInfo</a>
        <a class="nav-link text-white" href="index.html">← Beranda</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card login-card shadow">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 fw-bold text-center">Login CampusInfo</h1>
                    <p class="text-secondary text-center mb-4">
                        Masukkan email dan password untuk menguji form.
                    </p>

                    <div id="pesan" class="alert d-none" role="alert" aria-live="polite"></div>

                    <form id="formLogin" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email"
                                   class="form-control form-control-lg"
                                   placeholder="nama@email.com" required>
                            <div class="invalid-feedback">
                                Masukkan alamat email yang valid.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password"
                                   class="form-control form-control-lg"
                                   placeholder="Minimal 8 karakter"
                                   minlength="8" required>
                            <div class="invalid-feedback">
                                Password minimal 8 karakter.
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            Periksa Form
                        </button>
                    </form>

                    <p class="small text-secondary mt-4 mb-0">
                        Catatan: form ini hanya melakukan validasi input di browser,
                        bukan autentikasi akun yang sebenarnya.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer text-center">
    <p class="mb-0">© 2026 CampusInfo | Website Pembelajaran</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
